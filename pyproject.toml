[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp"
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/build.py" = ["E402"]

[tool.codespell]
ignore-words-list = "te,currenty,abd,indicies"
skip = "src/web/lib/*,src/web/js/i18n/locales/es.js,src/web/js/i18n/locales/ja.js,src/web/js/i18n/locales/ko.js,src/web/js/i18n/locales/ru.js,src/web/js/i18n/locales/zh-CN.js"
