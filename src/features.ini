; Feature flags for a BUILT (PyInstaller) exe -- see app/settings/features.py.
;
; Only consulted when running as a built .exe. Running directly from a source
; checkout (`python viewer_app.py`) always shows every feature regardless of
; what's set here, so source checkouts are not affected by flags meant for a
; distributed build.
;
; Set a flag to 0 before running build.py to hide that feature in the
; resulting exe (hiding the button only -- nothing else changes; the backend
; still refuses the underlying action either way). A missing file, missing
; section, or malformed value all default to 1 (shown).

[features]
Export = 1
Modify_Toggle = 1
Open_Disabled_Mod = 0
