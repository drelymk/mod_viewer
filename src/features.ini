; Feature flags for a BUILT (PyInstaller) exe -- see app/settings/features.py.
;
; Only consulted when running as a built .exe. Running directly from a source
; checkout (`python viewer_app.py`) always shows every feature regardless of
; what's set here, so source checkouts are not affected by flags meant for a
; distributed build.
;
; Set a flag to 0 before running build.py to hide the corresponding optional
; UI action in the resulting exe. This affects presentation only; the feature
; implementation is unchanged. Missing config, missing section, or malformed
; values continue to default to 1 (shown).

[features]
Export = 1
Modify_Toggle = 1
Open_Disabled_Mod = 0
Edit_Mesh = 0
