<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>3DMigoto Mod Viewer</title>
<link rel="stylesheet" href="css/app.css"/>
</head>
<!-- __BODY_CLASS__ is rewritten at serve time to a feature-flag-off class per
     app/features.py (e.g. "feature-export-off"), empty when every feature is
     shown -- see app/server.py and the matching CSS rules in app.css. -->
<body class="__BODY_CLASS__">

<div id="toolbar">
  <span class="app-icon">🎮</span>
  <span class="app-title">3DMigoto Mod Viewer</span>
  <span id="mod-path">No mod loaded</span>
  <span id="pending-indicator" class="pending-indicator">● Unsaved changes</span>
  <button id="open-btn">📂 Open Mod</button>
  <button id="export-btn" disabled>💾 Export</button>
</div>

<div id="canvas-container"></div>

<div id="left-dock">
  <div id="sidebar">
    <div class="panel-hdr">
      <span class="group-toggle">▼</span>
      <h3>Meshes</h3>
    </div>
    <div id="mesh-list"></div>
  </div>

  <div id="tool-panel">
    <div class="panel-hdr">
      <span class="group-toggle">▼</span>
      <h3>Tools</h3>
    </div>
    <div id="tool-buttons">
      <button id="wire-btn" class="tool-btn" title="Wireframe rendering">⬡</button>
      <button id="grid-btn" class="tool-btn" title="Grid visibility">⊞</button>
      <button id="shading-btn" class="tool-btn" title="Smooth/flat shading">◐</button>
      <button id="texture-btn" class="tool-btn" title="Textures visibility">▩</button>
      <button id="frame-btn" class="tool-btn" title="Frame model">⌖</button>
      <button id="reset-view-btn" class="tool-btn" title="Reset view">↺</button>
      <button id="reset-state-btn" class="tool-btn" title="Return meshes to default state">⌂</button>
      <div class="view-gizmo" title="View orientation">
        <button id="front-view-btn">F</button><button id="back-view-btn">B</button>
        <button id="left-view-btn">L</button><button id="right-view-btn">R</button>
        <button id="top-view-btn">T</button><button id="bottom-view-btn">D</button>
      </div>
    </div>
  </div>
</div>

<div id="right-dock">
  <div id="toggle-panel">
    <div class="panel-hdr">
      <span class="group-toggle">▼</span>
      <h3>Key Toggle</h3>
      <button id="toggle-add-btn" class="icon-btn" title="Add toggle">＋</button>
    </div>
    <div id="toggle-list"></div>
  </div>

  <div id="menu-panel">
    <div class="panel-hdr">
      <span class="group-toggle">▼</span>
      <h3>Menu Toggle</h3>
    </div>
    <div id="menu-list"></div>
  </div>
</div>

<div id="toggle-modal-backdrop" class="modal-backdrop">
  <div class="modal">
    <h4 id="tm-title">Add Toggle</h4>
    <div id="tm-error" class="modal-error"></div>
    <form id="tm-form">
      <label class="modal-field" id="tm-ini-field">
        <span>Ini file</span>
        <select id="tm-ini"></select>
      </label>
      <label class="modal-field">
        <span>Name</span>
        <input id="tm-name" type="text" autocomplete="off"/>
      </label>
      <label class="modal-field">
        <span>Key</span>
        <input id="tm-key" type="text" autocomplete="off" placeholder="e.g. 1 or ctrl 1"/>
      </label>
      <label class="modal-field">
        <span>Back key (optional)</span>
        <input id="tm-back" type="text" autocomplete="off"/>
      </label>
      <div id="tm-var-single">
        <label class="modal-field">
          <span>Variable name</span>
          <input id="tm-var" type="text" autocomplete="off" placeholder="e.g. swapvar"/>
        </label>
        <label class="modal-field">
          <span>Values (comma-separated)</span>
          <input id="tm-values" type="text" autocomplete="off" placeholder="0,1,2"/>
        </label>
        <label class="modal-field">
          <span>Default value (optional)</span>
          <input id="tm-default" type="text" autocomplete="off"/>
        </label>
      </div>
      <div id="tm-vars-multi"></div>
      <div class="modal-actions">
        <button type="button" id="tm-cancel">Cancel</button>
        <button type="submit" id="tm-save">Save</button>
      </div>
    </form>
  </div>
</div>

<div id="dialog-backdrop" class="dialog-backdrop">
  <div class="dialog-box">
    <div id="dialog-message" class="dialog-message"></div>
    <div class="modal-actions">
      <button type="button" id="dialog-cancel">Cancel</button>
      <button type="button" id="dialog-ok">OK</button>
    </div>
  </div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div id="status-text">Loading…</div>
</div>

<div id="hint">
  <div class="big">📦</div>
  <div class="msg">Click <strong>Open Mod</strong> and select a mod folder</div>
</div>

<div id="info">Drag to rotate &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Right-drag to pan</div>

<div id="footer">
  <span id="app-version">v__APP_VERSION__</span>
  <a id="github-link" href="__REPO_URL__" title="GitHub Repository" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
      <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
        0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01
        1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
        0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
        1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15
        0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2
        0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </svg>
  </a>
</div>

<!-- Rewritten at serve time to point at either the vendored Three.js copy or
     the CDN (see app/server.py). -->
<script type="importmap">
{
  "imports": {
    "three":          "__THREE_URL__",
    "three/addons/":  "__ADDONS_URL__"
  }
}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
