[Constants]
global $menu = 0
global $slot = 0
global $hoveredSlot = 0
global $clickedSlot = 0
global $mouse_clicked = 0
global $cursor_x = 0.5
global $active = 0
global persist $Hair = 0
global persist $Hat = 0
global persist $BoobsSize = 0.5
global persist $ButtSize = 0.5
global persist $ThighsSize = 0.5

[KeyMenu]
key = n
$menu = 1

[KeyClickedSlot]
key = c
if $mouse_clicked == 1
    $clickedSlot = $hoveredSlot
endif

[CommandListClickedSlot]
if $cursor_x >= 0
    $hoveredSlot = $slot
endif
if $mouse_clicked == 1
    $clickedSlot = $hoveredSlot
endif
if $clickedSlot == 1
    $Hair = 1 - $Hair
elif $clickedSlot == 2
    $Hat = 1 - $Hat
endif

[CommandListSlotImage]
if $slot == 1
    ps-t100 = ResourceMenuHair
elif $slot == 2
    ps-t100 = ResourceMenuHat
endif

[ResourceMenuHair]
filename = menu/hair.dds
[ResourceMenuHat]
filename = menu/hat.dds

[KeyBoobs]
key = 1
run = CommandListBoobs
[CommandListBoobs]
$BoobsSize = $cursor_x
if $BoobsSize < 0
    $BoobsSize = 0
endif
if $BoobsSize > 1
    $BoobsSize = 1
endif

[KeyButt]
key = 2
run = CommandListButt
[CommandListButt]
$ButtSize = $cursor_x
if $ButtSize < 0
    $ButtSize = 0
endif
if $ButtSize > 1
    $ButtSize = 1
endif

[KeyThighs]
key = 3
run = CommandListThighs
[CommandListThighs]
$ThighsSize = $cursor_x
if $ThighsSize < 0
    $ThighsSize = 0
endif
if $ThighsSize > 1
    $ThighsSize = 1
endif

[TextureOverrideHair]
vb0 = ResourcePosition
vb1 = ResourceTexcoord
ib = ResourceIndex
if $active
    if $Hair == 1
        drawindexed = 3, 0, 0
    endif
endif
[TextureOverrideHat]
vb0 = ResourcePosition
vb1 = ResourceTexcoord
ib = ResourceIndex
if $active
    if $Hat == 1
        drawindexed = 3, 0, 0
    endif
endif
[TextureOverrideBoobs]
vb0 = ResourcePosition
vb1 = ResourceTexcoord
ib = ResourceIndex
if $active
    if $BoobsSize >= 0
        drawindexed = 3, 0, 0
    endif
endif
[TextureOverrideButt]
vb0 = ResourcePosition
vb1 = ResourceTexcoord
ib = ResourceIndex
if $active
    if $ButtSize >= 0
        drawindexed = 3, 0, 0
    endif
endif
[TextureOverrideThighs]
vb0 = ResourcePosition
vb1 = ResourceTexcoord
ib = ResourceIndex
if $active
    if $ThighsSize >= 0
        drawindexed = 3, 0, 0
    endif
endif

[ResourcePosition]
filename = position.buf
stride = 12
[ResourceTexcoord]
filename = texcoord.buf
stride = 8
[ResourceIndex]
filename = index.buf
format = R32_UINT
