[Constants]
global persist $Body = 0
global persist $Hair = 0
global persist $Eyes = 0
global persist $HairColor = 0
global $Button_number = 0
global $mouse_clicked = 0

[KeyBody]
key = b
type = cycle
$Body = 0,1

[KeyHair]
key = h
type = cycle
$Hair = 0,1

[KeyMouse]
key = m
$mouse_clicked = 1

[KeyPreset]
key = p
run = CommandListPreset

[Present]
if $mouse_clicked
    run = CommandListClicked
endif

[CommandListPreset]
$Body = 1
$Hair = 1

[CommandListClicked]
if $Button_number == 1
    $Body = 1 - $Body
elif $Button_number == 2
    $Hair = 1 - $Hair
elif $Button_number == 3
    $Eyes = 1 - $Eyes
endif

[CommandListButtonImage]
if $Button_number == 1
    ps-t100 = ResourceButtonBody
elif $Button_number == 2
    ps-t100 = ResourceButtonHair
elif $Button_number == 3
    ps-t100 = ResourceButtonEyes
endif

[ResourceButtonBody]
filename = menu/body.dds
[ResourceButtonHair]
filename = menu/hair.dds
[ResourceButtonEyes]
filename = menu/eyes.dds

[TextureOverrideBody]
vb0 = ResourcePosition
vb1 = ResourceTexcoord
ib = ResourceIndex
if $Body == 1
    drawindexed = 3, 0, 0
endif
[TextureOverrideHair]
vb0 = ResourcePosition
vb1 = ResourceTexcoord
ib = ResourceIndex
if $Hair == 1
    drawindexed = 3, 0, 0
endif
[TextureOverrideEyes]
vb0 = ResourcePosition
vb1 = ResourceTexcoord
ib = ResourceIndex
if $Eyes == 1
    drawindexed = 3, 0, 0
endif
[TextureOverrideHairColor]
vb0 = ResourcePosition
vb1 = ResourceTexcoord
ib = ResourceIndex
if $HairColor == 1
    drawindexed = 3, 0, 0
endif

[ResourcePosition]
filename = position.buf
stride = 12
[ResourceTexcoord]
filename = texcoord.buf
stride = 8
[ResourceIndex]
filename = index.buf
format = R32_UINT
