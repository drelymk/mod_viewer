[Constants]
global persist $currFlat = 0.5
global persist $rangeFlat = 0.5
global persist $Outfit = 0
global persist $Top = 0
global $menu = 0
global $slot = 0
global $mouse_clicked = 0
global $cursor_x = 0.5

[KeyModViewerPresent]
key = p
type = cycle
$Outfit = 0,1

[Present]
if $mouse_clicked
    run = CommandListDragFlat
endif

[CommandListDragFlat]
$currFlat = $cursor_x
if $currFlat < 0
    $currFlat = 0
endif
if $currFlat > 1
    $currFlat = 1
endif
post $rangeFlat = $currFlat

[CommandListSlot]
if $slot == 1
    $Outfit = 1 - $Outfit
elif $slot == 2
    $Top = 1 - $Top
endif

[CommandListSlotImage]
if $slot == 1
    ps-t100 = ResourceMenuItem.1
elif $slot == 2
    ps-t100 = ResourceMenuItem.2
endif
[ResourceMenuItem.1]
filename = menu/flat.dds
[ResourceMenuItem.2]
filename = menu/top.dds

[TextureOverrideOutfit]
vb0 = ResourcePosition
vb1 = ResourceTexcoord
ib = ResourceIndex
if $Outfit == 1
    drawindexed = 3, 0, 0
endif
[TextureOverrideFlat]
vb0 = ResourcePosition
vb1 = ResourceTexcoord
ib = ResourceIndex
if $currFlat >= 0
    drawindexed = 3, 0, 0
endif
[TextureOverrideTop]
vb0 = ResourcePosition
vb1 = ResourceTexcoord
ib = ResourceIndex
if $Top == 1
    drawindexed = 3, 0, 0
endif

[ResourcePosition]
filename = position.buf
stride = 12
[ResourceTexcoord]
filename = texcoord.buf
stride = 8
[ResourceIndex]
filename = index.buf
format = R32_UINT
