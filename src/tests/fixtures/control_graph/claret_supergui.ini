[KeySuperGui]
key = F13
run = CommandListPointerLogic

[CommandListDraw]
$sp_hover = 1000 + $sp_button_index
$sp_image_index = $sp_button_index
run = CommandListSetImage

[CommandListPointerLogic]
$sp_capture = $sp_hover
if $sp_capture >= 1000
    run = CommandListToggleCapturedSwap
elif $sp_capture == 30
    run = CommandListStoreSV
endif

[CommandListToggleCapturedSwap]
if $sp_capture == 1000
    $swapkey0 = $swapkey0 + 1
    if $swapkey0 > 2
        $swapkey0 = 0
    endif
elif $sp_capture == 1001
    $swapkey1 = $swapkey1 + 1
    if $swapkey1 > 1
        $swapkey1 = 0
    endif
elif $sp_capture == 1002
    $swapkey2 = $swapkey2 + 1
    if $swapkey2 > 1
