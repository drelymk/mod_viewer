[Constants]
global persist $Outfit = 0
global persist $swapvarSliderBreast = 0.5
global persist $swapvarSliderBottom = 0.5
global $slot = 0
global $hovered_slot = 0
global $clicked_slot = 0
global $mouse_clicked = 0
global $cursor_x = 0.5
global $active = 0

[KeyOutfit]
key = o
type = cycle
$Outfit = 0,1

[Present]
run = CommandListSliders

[CommandListSliders]
if $cursor_x >= 0
    $hovered_slot = $slot
endif
if $mouse_clicked == 1
    $clicked_slot = $hovered_slot
endif
if $clicked_slot == 50
    $swapvarSliderBreast = $cursor_x
    if $swapvarSliderBreast < 0
        $swapvarSliderBreast = 0
    endif
    if $swapvarSliderBreast > 1
        $swapvarSliderBreast = 1
    endif
elif $clicked_slot == 51
    $swapvarSliderBottom = $cursor_x
    if $swapvarSliderBottom < 0
        $swapvarSliderBottom = 0
    endif
    if $swapvarSliderBottom > 1
        $swapvarSliderBottom = 1
    endif
endif

[CommandListSliderImage]
if $slot == 50
    ps-t100 = ResourceSliderBreast
elif $slot == 51
    ps-t100 = ResourceSliderBottom
endif
[ResourceSliderBreast]
filename = menu/breast.dds
[ResourceSliderBottom]
filename = menu/bottom.dds

[TextureOverrideOutfit]
vb0 = ResourcePosition
vb1 = ResourceTexcoord
ib = ResourceIndex
if $active
    if $Outfit == 1
        drawindexed = 3, 0, 0
    endif
endif
[TextureOverrideBreast]
vb0 = ResourcePosition
vb1 = ResourceTexcoord
ib = ResourceIndex
if $active
    if $swapvarSliderBreast >= 0
        drawindexed = 3, 0, 0
    endif
endif
[TextureOverrideBottom]
vb0 = ResourcePosition
vb1 = ResourceTexcoord
ib = ResourceIndex
if $active
    if $swapvarSliderBottom >= 0
        drawindexed = 3, 0, 0
    endif
endif

[ResourcePosition]
filename = position.buf
stride = 12
[ResourceTexcoord]
filename = texcoord.buf
stride = 8
[ResourceIndex]
filename = index.buf
format = R32_UINT
