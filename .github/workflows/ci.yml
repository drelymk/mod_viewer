name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python, core, app, and integration tests
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -q src/tests --ignore=src/tests/web

  browser:
    name: Browser and UI tests
    needs: prepare-assets
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Download verified browser assets
        uses: actions/download-artifact@v4
        with:
          name: verified-browser-assets
          path: src/assets

      - name: Verify browser assets
        run: >-
          python -c
          "import sys; sys.path.insert(0, 'src'); import build;
          build.verify_assets()"

      - name: Run browser and UI tests
        run: >-
          python -m pytest -q
          src/tests/web/test_app_flow.py
          src/tests/web/test_asset_flow.py
          src/tests/web/test_modules.py
          src/tests/web/test_ui.py

  rendering:
    name: WebGPU and rendering tests
    needs: prepare-assets
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Download verified browser assets
        uses: actions/download-artifact@v4
        with:
          name: verified-browser-assets
          path: src/assets

      - name: Verify browser assets
        run: >-
          python -c
          "import sys; sys.path.insert(0, 'src'); import build;
          build.verify_assets()"

      - name: Run WebGPU and rendering tests
        run: python -m pytest -q src/tests/web/test_rendering.py

  prepare-assets:
    name: Prepare verified browser assets
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Fetch and verify browser assets
        run: >-
          python -c
          "import sys; sys.path.insert(0, 'src'); import build;
          build.fetch_assets(); build.verify_assets()"

      - name: Upload verified browser assets
        uses: actions/upload-artifact@v4
        with:
          name: verified-browser-assets
          path: src/assets
          if-no-files-found: error
